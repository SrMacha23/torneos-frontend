<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a1a; }
        header { background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff; padding: 24px; text-align: center; }
        header h1 { font-size: 26px; }
        nav { margin-top: 8px; }
        nav a { color: #fff; margin: 0 10px; text-decoration: none; font-weight: 600; opacity: .85; }
        nav a:hover { opacity: 1; text-decoration: underline; }
        main { max-width: 950px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top h2 { color: #2575fc; }
        a.boton { background: #2575fc; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; text-decoration: none; }
        a.boton:hover { background: #1a5fd0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f7f8fa; }
        .acciones a { padding: 6px 12px; font-size: 13px; border-radius: 6px; text-decoration: none; color: #fff; margin-right: 6px; }
        .editar { background: #f39c12; }
        .editar:hover { background: #d68910; }
        .eliminar { background: #e74c3c; }
        .eliminar:hover { background: #c0392b; }
        .vacio { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Sistema de Torneos de Videojuegos</h1>
        <nav>
            <a href="/jugadores">👤 Jugadores</a>
            <a href="/torneos">🏆 Torneos</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <div class="top">
                <h2>Torneos registrados</h2>
                <a class="boton" th:href="@{/torneos/nuevo}">+ Nuevo torneo</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Videojuego</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="torneo : ${torneos}">
                        <td th:text="${torneo.id}">1</td>
                        <td th:text="${torneo.nombre}">Nombre</td>
                        <td th:text="${torneo.videojuego}">Juego</td>
                        <td th:text="${torneo.fecha}">Fecha</td>
                        <td th:text="${torneo.descripcion}">Descripción</td>
                        <td class="acciones">
                            <a class="editar" th:href="@{/torneos/editar/{id}(id=${torneo.id})}">Editar</a>
                            <a class="eliminar" th:href="@{/torneos/eliminar/{id}(id=${torneo.id})}"
                               onclick="return confirm('¿Seguro que querés eliminar este torneo?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="vacio" th:if="${#lists.isEmpty(torneos)}">No hay torneos registrados.</p>
        </div>
    </main>
</body>
</html>
