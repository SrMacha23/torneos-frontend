<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugadores - Torneos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a1a; }
        header { background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff; padding: 24px; text-align: center; }
        header h1 { font-size: 26px; }
        nav { margin-top: 8px; }
        nav a { color: #fff; margin: 0 10px; text-decoration: none; font-weight: 600; opacity: .85; }
        nav a:hover { opacity: 1; text-decoration: underline; }
        main { max-width: 950px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .top h2 { color: #2575fc; }
        a.boton, button { background: #2575fc; color: #fff; border: none; padding: 10px 16px; border-radius: 8px;
                          font-size: 14px; text-decoration: none; cursor: pointer; display: inline-block; }
        a.boton:hover { background: #1a5fd0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f7f8fa; }
        .acciones a { padding: 6px 12px; font-size: 13px; border-radius: 6px; text-decoration: none; color: #fff; margin-right: 6px; }
        .editar { background: #f39c12; }
        .editar:hover { background: #d68910; }
        .eliminar { background: #e74c3c; }
        .eliminar:hover { background: #c0392b; }
        .vacio { text-align: center; color: #888; padding: 20px; }

        /* Buscador */
        .buscador { display: flex; gap: 8px; margin-bottom: 16px; }
        .buscador input { flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .buscador input:focus { outline: none; border-color: #2575fc; }
        .buscador button { background: #6a11cb; }
        .buscador button:hover { background: #5a0db0; }
        .buscador a.limpiar { background: #e0e0e0; color: #333; padding: 9px 14px; border-radius: 8px;
                              text-decoration: none; font-size: 14px; display: inline-block; }
        .buscador a.limpiar:hover { background: #c8c8c8; }

        /* Mensajes */
        .alerta { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; font-weight: 600; }
        .alerta.exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alerta.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .resultado-busqueda { font-size: 13px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Gestión de Jugadores</h1>
        <nav>
            <a href="/dashboard">🏠 Inicio</a>
            <a href="/jugadores">👤 Jugadores</a>
            <a href="/torneos">🏆 Torneos</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <div class="top">
                <h2>Jugadores registrados</h2>
                <a class="boton" th:href="@{/jugadores/nuevo}">+ Nuevo jugador</a>
            </div>

            <!-- Mensajes de éxito/error -->
            <div class="alerta exito" th:if="${mensaje}" th:text="${mensaje}"></div>
            <div class="alerta error" th:if="${error}" th:text="${error}"></div>

            <!-- Buscador -->
            <form method="get" action="/jugadores" class="buscador">
                <input type="text" name="buscar" placeholder="Buscar por nombre, nickname o videojuego..."
                       th:value="${buscar}">
                <button type="submit">🔍 Buscar</button>
                <a class="limpiar" href="/jugadores">✕ Limpiar</a>
            </form>

            <p class="resultado-busqueda" th:if="${buscar != null and !buscar.isEmpty()}">
                Resultados para: <strong th:text="${buscar}"></strong>
                — <span th:text="${#lists.size(jugadores)}">0</span> encontrado(s)
            </p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Nickname</th>
                        <th>Email</th>
                        <th>Videojuego</th>
                        <th>Torneo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="jugador : ${jugadores}">
                        <td th:text="${jugador.id}">1</td>
                        <td th:text="${jugador.nombre}">Nombre</td>
                        <td th:text="${jugador.nickname}">Nick</td>
                        <td th:text="${jugador.email}">email</td>
                        <td th:text="${jugador.videojuego}">Juego</td>
                        <td th:text="${jugador.torneo != null and !jugador.torneo.isEmpty()} ? ${jugador.torneo} : '—'">Torneo</td>
                        <td class="acciones">
                            <a class="editar" th:href="@{/jugadores/editar/{id}(id=${jugador.id})}">Editar</a>
                            <a class="eliminar" th:href="@{/jugadores/eliminar/{id}(id=${jugador.id})}"
                               onclick="return confirm('¿Seguro que querés eliminar este jugador?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="vacio" th:if="${#lists.isEmpty(jugadores)}">No hay jugadores registrados.</p>
        </div>
    </main>
</body>
</html>
