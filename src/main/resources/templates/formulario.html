<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editar} ? 'Editar jugador' : 'Nuevo jugador'">Jugador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; color: #1a1a1a; }
        header { background: linear-gradient(135deg, #6a11cb, #2575fc); color: #fff; padding: 24px; text-align: center; }
        main { max-width: 520px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .card h2 { color: #2575fc; margin-bottom: 18px; }
        .campo { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; border-color: #2575fc; }
        .botones { display: flex; gap: 10px; margin-top: 8px; }
        button, a.cancelar { padding: 10px 18px; border: none; border-radius: 8px; font-size: 15px;
                             cursor: pointer; text-decoration: none; display: inline-block; }
        button { background: #2575fc; color: #fff; }
        button:hover { background: #1a5fd0; }
        a.cancelar { background: #e0e0e0; color: #333; }
        a.cancelar:hover { background: #c8c8c8; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Gestión de Jugadores</h1>
    </header>

    <main>
        <div class="card">
            <h2 th:text="${editar} ? 'Editar jugador' : 'Nuevo jugador'">Nuevo jugador</h2>

            <!-- th:object enlaza el formulario con el objeto jugador del modelo -->
            <form th:action="@{/jugadores/guardar}" th:object="${jugador}" method="post">

                <!-- Campo oculto: si tiene id, el backend hará UPDATE; si no, INSERT -->
                <input type="hidden" th:field="*{id}">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>

                <div class="campo">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" th:field="*{nickname}" required>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>

                <div class="campo">
                    <label for="videojuego">Videojuego</label>
                    <input type="text" id="videojuego" th:field="*{videojuego}" required>
                </div>
                
                <div class="campo">
                    <label for="torneo">Torneo</label>
                    <select id="torneo" th:field="*{torneo}"
                            style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;">
                        <option value="">-- Sin torneo --</option>
                        <option th:each="t : ${torneos}" th:value="${t.nombre}" th:text="${t.nombre}"></option>
                    </select>
                </div>


                <div class="botones">
                    <button type="submit">Guardar</button>
                    <a class="cancelar" th:href="@{/jugadores}">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
